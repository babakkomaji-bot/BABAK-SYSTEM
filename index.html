<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه بابک | دفتر انبار و حساب</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #16231D;
    --panel: #1D2E26;
    --panel-2: #24382F;
    --panel-3: #2B4137;
    --border: #33483D;
    --ink: #ECE7DA;
    --ink-dim: #A9B8AE;
    --ink-faint: #7C8C82;
    --gold: #C9A15A;
    --gold-dim: #8A754A;
    --green: #7BC79A;
    --green-bg: rgba(123,199,154,0.12);
    --red: #D08468;
    --red-bg: rgba(208,132,104,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(201,161,90,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(123,199,154,0.05), transparent 45%);
  }

  .ltr{ direction: ltr; text-align: left; }

  input, select, button, textarea{
    font-family: inherit;
  }

  input, select{
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 14px;
    width: 100%;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus, select:focus{
    border-color: var(--gold);
  }
  label{
    display:block;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .field{ margin-bottom: 14px; }

  button{
    cursor: pointer;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 18px;
    transition: transform .1s ease, opacity .15s ease;
  }
  button:active{ transform: scale(0.97); }
  .btn-primary{
    background: linear-gradient(180deg, #D6B36E, var(--gold));
    color: #1B140A;
  }
  .btn-primary:hover{ opacity:0.92; }
  .btn-ghost{
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover{ border-color: var(--gold-dim); }
  .btn-danger{
    background: var(--red-bg);
    color: var(--red);
    border: 1px solid rgba(208,132,104,0.35);
  }
  .btn-sm{ padding: 7px 12px; font-size: 12.5px; }
  .btn-block{ width: 100%; }

  /* ---------- Login ---------- */
  #login-screen{
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .login-card{
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
  }
  .seal{
    width: 56px; height:56px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 16px auto;
    font-size: 22px; font-weight:800; color: var(--gold);
    box-shadow: 0 0 0 4px rgba(201,161,90,0.08);
  }
  .brand-title{
    text-align:center;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin: 0 0 2px 0;
  }
  .brand-sub{
    text-align:center;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin: 0 0 22px 0;
  }
  .login-error{
    color: var(--red);
    font-size: 12.5px;
    text-align:center;
    min-height: 18px;
    margin-top: 8px;
  }
  .login-hint{
    color: var(--ink-faint);
    font-size: 11.5px;
    text-align:center;
    margin-top: 18px;
    line-height: 1.9;
  }

  /* ---------- App shell ---------- */
  #app-shell{ display:none; min-height: 100vh; flex-direction: column; }
  header.topbar{
    position: sticky; top:0; z-index: 10;
    background: rgba(22,35,29,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar-left{ display:flex; align-items:center; gap:10px; }
  .seal-sm{
    width: 34px; height:34px; border-radius:50%;
    border: 1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:var(--gold); font-size:14px;
  }
  .topbar-title{ font-weight:800; font-size:15px; }
  .topbar-date{ font-size:11.5px; color: var(--ink-dim); }
  .icon-btn{
    background: transparent; border: 1px solid var(--border);
    color: var(--ink-dim); width: 36px; height:36px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    padding:0;
  }

  nav.tabs{
    display:flex; gap:8px; overflow-x:auto;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-dim);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tab-btn.active{
    background: var(--gold);
    color: #1B140A;
    border-color: var(--gold);
  }

  main{ flex:1; padding: 16px; padding-bottom: 60px; max-width: 720px; width:100%; margin: 0 auto; }

  .section-title{
    font-size: 15px; font-weight: 800; margin: 4px 0 12px 0;
    display:flex; align-items:center; justify-content:space-between;
  }

  .cards-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px;
  }
  .stat-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .stat-card .stat-label{ font-size: 11.5px; color: var(--ink-dim); margin-bottom:6px; }
  .stat-card .stat-value{ font-size: 16px; font-weight: 800; }
  .stat-card.wide{ grid-column: 1 / -1; }
  .stat-value.green{ color: var(--green); }
  .stat-value.red{ color: var(--red); }
  .stat-value.gold{ color: var(--gold); }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }

  .table-wrap{ overflow-x: auto; overflow-y: auto; max-height: 60vh; border-radius: var(--radius); border:1px solid var(--border); }
  table{ width:100%; border-collapse: collapse; min-width: 560px; }
  th, td{
    text-align: right;
    padding: 10px 12px;
    font-size: 12.8px;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  thead th{
    background: var(--panel-2);
    color: var(--ink-dim);
    font-weight: 600;
    position: sticky; top:0;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background: rgba(255,255,255,0.02); }

  .badge{
    display:inline-block; padding: 3px 9px; border-radius:999px;
    font-size: 11px; font-weight: 700;
  }
  .badge.in-stock{ background: var(--green-bg); color: var(--green); }
  .badge.sold-out{ background: rgba(255,255,255,0.06); color: var(--ink-faint); }
  .badge.purchase{ background: var(--red-bg); color: var(--red); }
  .badge.sale{ background: var(--green-bg); color: var(--green); }
  .badge.payment{ background: rgba(201,161,90,0.15); color: var(--gold); }
  .badge.cash{ background: var(--green-bg); color: var(--green); }
  .badge.credit{ background: var(--red-bg); color: var(--red); }
  .badge.transfer{ background: rgba(127,168,224,0.15); color: #7fa8e0; }
  .badge.card{ background: rgba(180,140,220,0.15); color: #b48cdc; }
  .badge.service{ background: rgba(201,161,90,0.15); color: var(--gold); }

  .row-actions{ display:flex; gap:6px; }

  .empty-state{
    text-align:center; padding: 40px 20px; color: var(--ink-faint);
  }
  .empty-state .big{ font-size: 30px; margin-bottom:10px; }
  .empty-state p{ font-size: 13px; line-height:1.9; margin:0; }

  .fab{
    position: fixed; left: 18px; bottom: 18px; z-index: 20;
    width: 54px; height:54px; border-radius:50%;
    background: linear-gradient(180deg,#D6B36E, var(--gold));
    color:#1B140A; font-size: 26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none; position: fixed; inset:0; background: rgba(0,0,0,0.55);
    z-index: 50; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-top-right-radius: 18px; border-top-left-radius: 18px;
    width: 100%; max-width: 480px;
    padding: 20px 18px 24px 18px;
    max-height: 88vh; overflow-y:auto;
    animation: slideup .18s ease;
  }
  @keyframes slideup{ from{ transform: translateY(30px); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes alarmPulse{
    0%, 100% { box-shadow: 0 0 0 0 rgba(208,132,104,0.55); }
    50% { box-shadow: 0 0 0 18px rgba(208,132,104,0); }
  }
  @keyframes alarmBellShake{
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-12deg); }
    40% { transform: rotate(10deg); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(6deg); }
  }
  .alarm-card{
    border: 2px solid var(--red) !important;
    animation: alarmPulse 1.4s infinite;
  }
  .alarm-bell{
    font-size: 40px;
    text-align: center;
    margin-bottom: 10px;
    animation: alarmBellShake 1s infinite;
  }
  .reminder-day-header{
    font-size: 12.5px; font-weight: 700; color: var(--gold);
    margin: 16px 0 8px 0; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .reminder-card{
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px; margin-bottom: 8px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .reminder-card.overdue{ border-color: var(--red); background: var(--red-bg); }
  .modal-title{ font-size:15px; font-weight:800; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .modal-close{ background:none; border:none; color:var(--ink-dim); font-size:18px; padding:4px; }
  .modal-actions{ display:flex; gap:10px; margin-top: 6px; }
  .modal-actions button{ flex:1; }

  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  #toast-host{
    position: fixed; top: 14px; left:50%; transform: translateX(-50%);
    z-index: 100; display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  .toast{
    background: var(--panel-3);
    border: 1px solid var(--gold-dim);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    animation: fadein .15s ease;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;} }

  .sub-tabs{ display:flex; gap:8px; margin-bottom: 12px; }
  .sub-tab{
    flex:1; text-align:center;
    background: var(--panel-2); border:1px solid var(--border); color: var(--ink-dim);
    padding: 8px; border-radius: var(--radius-sm); font-size:12.5px; font-weight:600;
  }
  .sub-tab.active{ background: var(--panel-3); color: var(--gold); border-color: var(--gold-dim); }

  .divider{ height:1px; background: var(--border); margin: 16px 0; }

  .hint-box{
    font-size: 11.5px; color: var(--ink-faint); line-height:1.9;
    background: var(--panel-2); border: 1px dashed var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px;
  }

  @media (min-width: 640px){
    .cards-grid{ grid-template-columns: repeat(4,1fr); }
    .stat-card.wide{ grid-column: auto; }
  }
</style>
</head>
<body>

<div id="toast-host"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card" id="login-card"></div>
</div>

<!-- APP -->
<div id="app-shell">
  <header class="topbar">
    <div class="topbar-left">
      <div class="seal-sm">ب</div>
      <div>
        <div class="topbar-title">سامانه بابک</div>
        <div class="topbar-date" id="topbar-date"></div>
      </div>
    </div>
    <button class="icon-btn" id="logout-btn" title="خروج">⎋</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn" data-tab="pos">صندوق فروش</button>
    <button class="tab-btn" data-tab="inventory">انبار</button>
    <button class="tab-btn" data-tab="services">خدمات</button>
    <button class="tab-btn" data-tab="customers">CRM</button>
    <button class="tab-btn" data-tab="ledger">گردش حساب</button>
    <button class="tab-btn" data-tab="expenses">هزینه‌های جانبی</button>
    <button class="tab-btn" data-tab="reports">سود و زیان</button>
    <button class="tab-btn" data-tab="settings">تنظیمات</button>
  </nav>

  <main id="main-content"></main>
</div>

<div class="fab" id="fab-add" style="display:none;">＋</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card" id="modal-card"></div>
</div>

<script>
/* ===================== Storage layer (persists locally via localStorage) ===================== */
const memStore = {};

async function storageGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return memStore[key] ?? null; }
}
async function storageSet(key, val){
  try{ localStorage.setItem(key, val); }
  catch(e){ memStore[key] = val; }
}

/* ===================== Utilities ===================== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset();
  const local = new Date(d.getTime() - tz*60000);
  return local.toISOString().slice(0,10);
}
function toFaDigits(input){
  return String(input).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}
function numFa(n){
  let num = Math.round(Number(n || 0));
  const negative = num < 0;
  num = Math.abs(num);
  const withCommas = String(num).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (negative ? '-' : '') + toFaDigits(withCommas);
}
function toman(n){
  return numFa(n) + ' تومان';
}
function paymentTypeLabel(type){
  if(type === 'credit') return 'نسیه';
  if(type === 'transfer') return 'واریز';
  if(type === 'card') return 'کارتخوان';
  return 'نقدی';
}
function paymentTypeBadgeClass(type){
  if(type === 'credit') return 'credit';
  if(type === 'transfer') return 'transfer';
  if(type === 'card') return 'card';
  return 'cash';
}

/* ---- Live comma formatting for money input fields (کلاس money-input) ---- */
function commaizeDigits(digitsStr){
  return digitsStr.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function formatMoneyInputValue(n){
  const num = Math.round(Number(n || 0));
  if(!num) return '';
  return commaizeDigits(String(Math.abs(num)));
}
function parseMoneyInput(id){
  const el = document.getElementById(id);
  if(!el) return NaN;
  const raw = el.value.replace(/[^\d]/g, '');
  return raw === '' ? NaN : parseFloat(raw);
}
function bindMoneyInputFormatting(){
  document.querySelectorAll('.money-input').forEach(input => {
    input.oninput = () => {
      const cursorFromEnd = input.value.length - input.selectionStart;
      const raw = input.value.replace(/[^\d]/g, '');
      input.value = raw ? commaizeDigits(raw) : '';
      const pos = Math.max(0, input.value.length - cursorFromEnd);
      input.setSelectionRange(pos, pos);
    };
  });
}

// Builds <option> entries for a <datalist> so typing even part of a name
// surfaces matching existing entries (Chromium/Electron filter datalist
// options by substring, not just prefix).
function nameDatalistOptions(names){
  const unique = [...new Set(names.filter(Boolean).map(n => n.trim()).filter(Boolean))];
  return unique.map(n => `<option value="${n}"></option>`).join('');
}

// Reusable live-filter search box: filters a table as the user types,
// even mid-word, while keeping focus and cursor position across the
// full re-render (renderMain rebuilds the DOM on every keystroke).
function matchesSearch(text, query){
  if(!query || !query.trim()) return true;
  return String(text || '').toLowerCase().includes(query.trim().toLowerCase());
}
function bindTableSearch(inputId, setValue, rerender){
  const input = document.getElementById(inputId);
  if(!input) return;
  input.oninput = () => {
    const pos = input.selectionStart;
    setValue(input.value);
    rerender();
    requestAnimationFrame(() => {
      const el = document.getElementById(inputId);
      if(el){ el.focus(); el.setSelectionRange(pos, pos); }
    });
  };
}

const jMonths = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

const SERVICE_CATEGORIES = [
  { key: 'copy-print', label: 'خدمات کپی و پرینت' },
  { key: 'print', label: 'خدمات چاپ' },
  { key: 'design', label: 'خدمات طراحی' },
  { key: 'other', label: 'سایر خدمات' }
];
// چاپ و طراحی قیمت ثابتی ندارند، پس در فهرست خدمات (کاتالوگ) نمایش داده نمی‌شوند؛
// این دو دسته مستقیماً هنگام فروش در صندوق با هزینه/قیمت دستی ثبت می‌شوند.
const CATALOG_SERVICE_CATEGORIES = SERVICE_CATEGORIES.filter(c => c.key === 'copy-print' || c.key === 'other');
function serviceCategoryLabel(key){
  const found = SERVICE_CATEGORIES.find(c => c.key === key);
  return found ? found.label : 'سایر خدمات';
}
// Fall back gracefully for services saved before cost/salePrice existed (older "price" field)
function serviceCost(s){ return s.cost != null ? s.cost : 0; }
function serviceSalePrice(s){ return s.salePrice != null ? s.salePrice : (s.price || 0); }
function serviceCategoryKey(s){ return s.category || 'other'; }

function jalaliParts(iso){
  const d = new Date(iso + 'T12:00:00');
  const parts = new Intl.DateTimeFormat('en-US-u-ca-persian', {year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(d);
  const obj = {};
  parts.forEach(p => obj[p.type] = p.value);
  return { y: obj.year, m: obj.month, d: obj.day };
}
function jalaliDisplay(iso){
  if(!iso) return '—';
  const p = jalaliParts(iso);
  return toFaDigits(`${p.y}/${p.m}/${p.d}`);
}
function jalaliMonthLabel(iso){
  const p = jalaliParts(iso);
  return `${jMonths[parseInt(p.m,10)-1]} ${toFaDigits(p.y)}`;
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function showToast(msg){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-card').classList.remove('alarm-card');
  document.getElementById('modal-card').innerHTML = '';
}
function openModal(html){
  document.getElementById('modal-card').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function confirmAction(message, onYes){
  openModal(`
    <div class="modal-title">تایید عملیات</div>
    <p style="font-size:13.5px; color:var(--ink-dim); line-height:1.9;">${message}</p>
    <div class="modal-actions">
      <button class="btn-ghost" id="confirm-no">انصراف</button>
      <button class="btn-danger" id="confirm-yes">تایید و ادامه</button>
    </div>
  `);
  document.getElementById('confirm-no').onclick = closeModal;
  document.getElementById('confirm-yes').onclick = () => { closeModal(); onYes(); };
}

/* ===================== Auto-Backup (folder-based) ===================== */
let backupMode = null;        // 'electron' | 'fsapi' | 'unsupported'
let backupFolderPath = null;  // electron mode: chosen folder path (string)
let backupDirHandle = null;   // browser mode: FileSystemDirectoryHandle

const BACKUP_DB_NAME = 'sarjam_backup_db';
const BACKUP_STORE = 'handles';

function openBackupDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(BACKUP_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(BACKUP_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await openBackupDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BACKUP_STORE, 'readwrite');
    tx.objectStore(BACKUP_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await openBackupDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(BACKUP_STORE, 'readonly');
    const req = tx.objectStore(BACKUP_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function detectBackupMode(){
  if(typeof window.posBridge !== 'undefined' && window.posBridge.chooseBackupFolder) return 'electron';
  if(typeof window.showDirectoryPicker === 'function') return 'fsapi';
  return 'unsupported';
}

function hasBackupFolderConfigured(){
  if(backupMode === 'electron') return !!backupFolderPath;
  if(backupMode === 'fsapi') return !!backupDirHandle;
  return false;
}

async function initBackup(){
  backupMode = detectBackupMode();
  if(backupMode === 'electron'){
    backupFolderPath = localStorage.getItem('sarjam_backup_folder_path') || null;
  } else if(backupMode === 'fsapi'){
    try{
      const handle = await idbGet('backupDirHandle');
      if(handle){
        const perm = await handle.queryPermission({ mode: 'readwrite' });
        backupDirHandle = (perm === 'granted') ? handle : null;
      }
    }catch(e){ backupDirHandle = null; }
  }
  if(backupMode !== 'unsupported' && !hasBackupFolderConfigured()){
    showBackupSetupPrompt();
  }
}

function showBackupSetupPrompt(){
  openModal(`
    <div class="modal-title">تنظیم پوشه پشتیبان خودکار <button class="modal-close" id="modal-close">✕</button></div>
    <p style="font-size:13px; color:var(--ink-dim); line-height:1.9;">
      یک پوشه روی سیستم انتخاب کنید تا از این پس، بعد از هر فروش در صندوق، یک نسخه
      به‌روز از تمام اطلاعات به‌طور خودکار در همان پوشه ذخیره شود.
    </p>
    <div class="modal-actions">
      <button class="btn-ghost" id="skip-backup-setup">بعداً از تنظیمات</button>
      <button class="btn-primary" id="choose-backup-folder-btn">انتخاب پوشه</button>
    </div>
  `);
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('skip-backup-setup').onclick = closeModal;
  document.getElementById('choose-backup-folder-btn').onclick = chooseBackupFolder;
}

async function chooseBackupFolder(){
  if(backupMode === 'electron'){
    const folder = await window.posBridge.chooseBackupFolder();
    if(!folder){ showToast('انتخاب پوشه لغو شد'); return; }
    backupFolderPath = folder;
    localStorage.setItem('sarjam_backup_folder_path', folder);
    showToast('پوشه پشتیبان با موفقیت تنظیم شد');
    closeModal();
    renderMain();
  } else if(backupMode === 'fsapi'){
    try{
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      backupDirHandle = handle;
      await idbSet('backupDirHandle', handle);
      showToast('پوشه پشتیبان با موفقیت تنظیم شد');
      closeModal();
      renderMain();
    }catch(e){
      if(e.name !== 'AbortError') showToast('انتخاب پوشه ناموفق بود');
    }
  } else {
    showToast('مرورگر شما از این قابلیت پشتیبانی نمی‌کند');
  }
}

async function writeAutoBackup(){
  if(!hasBackupFolderConfigured()) return;
  const payload = {
    appName: 'سامانه بابک', exportVersion: 1, exportedAt: todayISO(),
    items, txs, invoices, services, customers, reminders, expenses
  };
  const json = JSON.stringify(payload, null, 2);
  try{
    if(backupMode === 'electron'){
      const res = await window.posBridge.writeBackupFile({ folderPath: backupFolderPath, filename: 'babak-backup.json', content: json });
      if(!res || !res.ok) showToast('خطا در ذخیره پشتیبان خودکار');
    } else if(backupMode === 'fsapi'){
      const perm = await backupDirHandle.queryPermission({ mode: 'readwrite' });
      if(perm !== 'granted'){
        showToast('دسترسی به پوشه پشتیبان قطع شده؛ از تنظیمات دوباره وصل کنید');
        return;
      }
      const fileHandle = await backupDirHandle.getFileHandle('babak-backup.json', { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
    }
  }catch(e){
    showToast('خطا در ذخیره خودکار پشتیبان');
  }
}

function syncCustomerDisplay(){
  if(typeof window.posBridge === 'undefined') return;
  const lines = cart.map(l => ({ name: l.name, qty: l.qty, unitPrice: l.unitPrice, total: l.qty*l.unitPrice }));
  const total = lines.reduce((s,l) => s + l.total, 0);
  window.posBridge.sendCartUpdate({ lines, total });
}

function addToCart(itemId, qty){
  const item = items.find(i => i.id === itemId);
  if(!item || item.qty <= 0){ showToast('این کالا موجود نیست'); return; }
  const existing = cart.find(c => c.itemId === itemId && c.kind === 'product');
  const already = existing ? existing.qty : 0;
  let addQty = qty;
  if(already + addQty > item.qty){
    addQty = item.qty - already;
    if(addQty <= 0){ showToast('موجودی کافی برای این کالا در سبد نیست'); return; }
    showToast(`فقط ${numFa(addQty)} عدد به دلیل محدودیت موجودی اضافه شد`);
  }
  if(existing) existing.qty += addQty;
  else cart.push({ itemId, name: item.name, unitPrice: item.salePrice, qty: addQty, kind: 'product' });
  syncCustomerDisplay();
  renderMain();
}

function addServiceToCart(serviceId, qty){
  const svc = services.find(s => s.id === serviceId);
  if(!svc){ showToast('خدمتی برای افزودن انتخاب نشده'); return; }
  const existing = cart.find(c => c.itemId === serviceId && c.kind === 'service');
  if(existing) existing.qty += qty;
  else cart.push({ itemId: svc.id, name: svc.name, unitPrice: serviceSalePrice(svc), cost: serviceCost(svc), category: serviceCategoryKey(svc), qty, kind: 'service' });
  syncCustomerDisplay();
  renderMain();
}

// چاپ/طراحی قیمت ثابت ندارند: هر بار به‌عنوان یک ردیف مستقل و تازه به سبد اضافه می‌شود (نه از فهرست خدمات)
function addAdHocServiceToCart(category, name, cost, salePrice, qty){
  cart.push({ itemId: uid(), name, unitPrice: salePrice, cost, category, qty, kind: 'service' });
  syncCustomerDisplay();
  renderMain();
}

function changeCartQty(itemId, kind, delta){
  const line = cart.find(c => c.itemId === itemId && c.kind === kind);
  if(!line) return;
  const newQty = line.qty + delta;
  if(newQty <= 0){
    cart = cart.filter(c => !(c.itemId === itemId && c.kind === kind));
  } else if(kind === 'product'){
    const item = items.find(i => i.id === itemId);
    if(item && newQty > item.qty){ showToast('بیشتر از موجودی انبار نمی‌توان افزود'); return; }
    line.qty = newQty;
  } else {
    line.qty = newQty;
  }
  syncCustomerDisplay();
  renderMain();
}

function removeCartLine(itemId, kind){
  cart = cart.filter(c => !(c.itemId === itemId && c.kind === kind));
  syncCustomerDisplay();
  renderMain();
}

function resolveCustomerForSale(name, phone){
  name = (name || '').trim();
  phone = (phone || '').trim();
  if(!name && !phone) return null;

  let customer = null;
  if(phone){
    customer = customers.find(c => c.phone && c.phone.replace(/\s/g,'') === phone.replace(/\s/g,''));
  }
  if(!customer && name && !phone){
    customer = customers.find(c => c.name === name);
  }
  if(customer){
    if(name && (!customer.name || customer.name === 'مشتری بدون نام')) customer.name = name;
    if(phone && !customer.phone) customer.phone = phone;
    return customer;
  }
  const newCustomer = { id: uid(), name: name || 'مشتری بدون نام', phone: phone || '', address: '', createdDate: todayISO() };
  customers.push(newCustomer);
  return newCustomer;
}

async function finalizeSale(){
  if(cart.length === 0){ showToast('سبد خرید خالی است'); return; }

  const nameInput = document.getElementById('pos-customer-name');
  const phoneInput = document.getElementById('pos-customer-phone');
  const paymentTypeSelect = document.getElementById('pos-payment-type');
  const typedName = nameInput ? nameInput.value.trim() : '';
  const typedPhone = phoneInput ? phoneInput.value.trim() : '';
  const paymentType = paymentTypeSelect ? paymentTypeSelect.value : 'cash';

  if(paymentType === 'credit' && !typedName && !typedPhone){
    showToast('برای ثبت فروش نسیه، نام یا شماره تماس مشتری را وارد کنید');
    return;
  }

  const customer = resolveCustomerForSale(typedName, typedPhone);
  const invoiceId = uid();
  const date = todayISO();
  const lines = [];

  for(const l of cart){
    if(l.kind === 'product'){
      const item = items.find(i => i.id === l.itemId);
      if(!item) continue;
      const sellQty = Math.min(l.qty, item.qty);
      if(sellQty <= 0) continue;
      item.qty -= sellQty;
      if(item.qty === 0) item.exitDate = date;
      const lineTotal = sellQty * l.unitPrice;
      txs.push({
        id: uid(), date, type: 'sale', itemId: item.id, itemName: item.name, kind: 'product',
        qty: sellQty, unitPrice: l.unitPrice, total: lineTotal,
        cost: sellQty * item.purchasePrice, profit: sellQty * (l.unitPrice - item.purchasePrice),
        invoiceId,
        customerId: customer ? customer.id : null,
        customerName: customer ? customer.name : 'مشتری مهمان',
        customerPhone: customer ? (customer.phone || '') : ''
      });
      lines.push({ name: item.name, qty: sellQty, unitPrice: l.unitPrice, total: lineTotal, kind: 'product' });
    } else {
      const svc = services.find(s => s.id === l.itemId);
      const unitCost = svc ? serviceCost(svc) : (l.cost || 0);
      const category = svc ? serviceCategoryKey(svc) : (l.category || 'other');
      const lineTotal = l.qty * l.unitPrice;
      const lineCost = l.qty * unitCost;
      txs.push({
        id: uid(), date, type: 'sale', itemId: l.itemId, itemName: l.name, kind: 'service', category,
        qty: l.qty, unitPrice: l.unitPrice, total: lineTotal,
        cost: lineCost, profit: lineTotal - lineCost,
        invoiceId,
        customerId: customer ? customer.id : null,
        customerName: customer ? customer.name : 'مشتری مهمان',
        customerPhone: customer ? (customer.phone || '') : ''
      });
      lines.push({ name: l.name, qty: l.qty, unitPrice: l.unitPrice, total: lineTotal, kind: 'service' });
    }
  }
  if(lines.length === 0){ showToast('امکان ثبت این فروش نبود، موجودی را بررسی کنید'); return; }

  const total = lines.reduce((s,l) => s + l.total, 0);
  const invoice = {
    id: invoiceId, date, lines, total,
    customerId: customer ? customer.id : null,
    customerName: customer ? customer.name : 'مشتری مهمان',
    customerPhone: customer ? (customer.phone || '') : '',
    paymentType
  };
  invoices.push(invoice);
  await saveItems(); await saveTx(); await saveInvoices(); await saveCustomers();
  writeAutoBackup();
  if(typeof window.posBridge !== 'undefined'){
    window.posBridge.sendInvoice(invoice);
    window.posBridge.sendCartUpdate({ lines: [], total: 0 });
  }
  cart = [];
  showToast('فروش با موفقیت ثبت شد');
  renderMain();
}

function customerBalance(customerId){
  let owed = 0;
  invoices.forEach(inv => { if(inv.customerId === customerId && inv.paymentType === 'credit') owed += inv.total; });
  txs.forEach(t => { if(t.type === 'payment' && t.customerId === customerId) owed -= t.total; });
  return owed;
}
function customerTotalPurchases(customerId){
  return invoices.filter(inv => inv.customerId === customerId).reduce((s,inv) => s + inv.total, 0);
}
function customerPrintOrders(customerId){
  return txs.filter(t => t.type === 'sale' && t.kind === 'service' && t.category === 'print' && t.customerId === customerId)
             .sort((a,b) => b.date.localeCompare(a.date));
}

      lastDateKey = r.nextDueDate;

      header = `<div class="reminder-day-header">${weekday} — ${jalaliDisplay(r.nextDueDate)}${isOverdue && r.nextDueDate < today ? ' (گذشته)' : ''}</div>`;

function addDaysISO(iso, days){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

async function completeReminder(reminderId){
  const r = reminders.find(x => x.id === reminderId);
  if(!r) return;
  r.nextDueDate = addDaysISO(todayISO(), r.frequencyDays);
  r.lastAlarmedDate = null;
  await saveReminders();
  renderMain();
  showToast('یادآوری تکمیل شد و سررسید بعدی تنظیم شد');
}

function icsEscape(s){
  return String(s || '').replace(/[,;]/g, '\\$&').replace(/\n/g, '\\n');
}

function downloadReminderICS(reminderId){
  const r = reminders.find(x => x.id === reminderId);
  if(!r) return;
  const dt = r.nextDueDate.replace(/-/g, '');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BabakSystem//Reminder//FA', 'BEGIN:VEVENT',
    `UID:${r.id}@babaksystem`, `DTSTART;VALUE=DATE:${dt}`,
    `RRULE:FREQ=DAILY;INTERVAL=${r.frequencyDays}`,
    `SUMMARY:${icsEscape(r.title + ' - ' + r.customerName)}`,
    `DESCRIPTION:${icsEscape(r.notes)}`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `reminder-${r.id}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('فایل تقویم دانلود شد');
}

/* ---- Visual + audio alarm for due reminders ---- */
function playAlarmBeep(times){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    let i = 0;
    function beepOnce(){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.value = 0.25;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      setTimeout(() => { o.stop(); }, 220);
      i++;
      if(i < times) setTimeout(beepOnce, 350);
    }
    beepOnce();
  }catch(e){}
}

async function checkReminderAlarms(){
  if(document.getElementById('modal-overlay').classList.contains('open')) return; // don't interrupt an open modal
  const today = todayISO();
  const due = reminders.find(r => r.active && r.nextDueDate <= today && r.lastAlarmedDate !== today);
  if(!due) return;
  due.lastAlarmedDate = today;
  await saveReminders();
  triggerAlarmModal(due);
  playAlarmBeep(3);
}

function triggerAlarmModal(reminder){
  openModal(`
    <div class="alarm-bell">🔔</div>
    <div class="modal-title" style="justify-content:center; text-align:center;">یادآوری سفارش مشتری</div>

      <button class="btn-primary" id="alarm-done">تکمیل شد</button>
    </div>
  `);
  document.getElementById('modal-card').classList.add('alarm-card');

function renderLedger(){

  const totalSale = txs.filter(t=>t.type==='sale').reduce((s,t)=>s+t.total,0);

  const typeLabel = t => t.type === 'purchase' ? 'خرید' : t.type === 'payment' ? 'دریافت وجه' : 'فروش';

    if(t.type === 'purchase' || !t.customerName) return '—';

    matchesSearch(t.itemName, ledgerSearchQuery) ||
    matchesSearch(t.customerName, ledgerSearchQuery) ||

        <div class="stat-value ${totalProfit>=0?'green':'red'}">${toman(totalProfit)}</div>

      <input type="text" id="ledger-search" placeholder="🔍 جستجو بر اساس نام کالا/خدمت، مشتری، شماره تماس یا نوع..." value="${ledgerSearchQuery}">

    <div class="section-title"><span>گردش حساب</span></div>

function requestEditPin(onSuccess){
  if(!editPinHash){
    openModal(`
      <div class="modal-title">تنظیم رمز ۴ رقمی ویرایش <button class="modal-close" id="modal-close">✕</button></div>
      <div class="hint-box" style="margin-top:0;">برای ویرایش ردیف‌های خرید و فروش، ابتدا یک رمز ۴ رقمی تنظیم کنید. این رمز جدا از رمز عبور ورود به برنامه است.</div>
      <div class="field" style="margin-top:14px;"><label>رمز ۴ رقمی جدید</label><input type="password" id="setup-pin1" class="ltr" maxlength="4" inputmode="numeric" placeholder="مثلاً: ۱۲۳۴"></div>
      <div class="field"><label>تکرار رمز ۴ رقمی</label><input type="password" id="setup-pin2" class="ltr" maxlength="4" inputmode="numeric"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancel-setup-pin">انصراف</button>
        <button class="btn-primary" id="save-setup-pin">ذخیره و ادامه</button>
      </div>
    `);
    document.getElementById('modal-close').onclick = closeModal;
    document.getElementById('cancel-setup-pin').onclick = closeModal;
    document.getElementById('save-setup-pin').onclick = async () => {
      const p1 = document.getElementById('setup-pin1').value.trim();
      const p2 = document.getElementById('setup-pin2').value.trim();
      if(!/^\d{4}$/.test(p1)){ showToast('رمز باید دقیقاً ۴ رقم باشد'); return; }
      if(p1 !== p2){ showToast('تکرار رمز مطابقت ندارد'); return; }
      await saveEditPin(await sha256Hex(p1));
      closeModal();
      showToast('رمز ۴ رقمی تنظیم شد');
      onSuccess();
    };
    return;
  }

  openModal(`
    <div class="modal-title">ورود رمز ۴ رقمی <button class="modal-close" id="modal-close">✕</button></div>
    <div class="field"><label>رمز ۴ رقمی ویرایش</label><input type="password" id="enter-pin" class="ltr" maxlength="4" inputmode="numeric" autofocus></div>
    <div class="login-error" id="pin-err"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancel-enter-pin">انصراف</button>
      <button class="btn-primary" id="confirm-enter-pin">تایید</button>
    </div>
  `);
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('cancel-enter-pin').onclick = closeModal;
  const doVerify = async () => {
    const pin = document.getElementById('enter-pin').value.trim();
    const hash = await sha256Hex(pin);
    if(hash === editPinHash){ closeModal(); onSuccess(); }
    else{ document.getElementById('pin-err').textContent = 'رمز اشتباه است'; }
  };
  document.getElementById('confirm-enter-pin').onclick = doVerify;
  document.getElementById('enter-pin').addEventListener('keydown', e => { if(e.key === 'Enter') doVerify(); });
}

function openEditTransactionModal(txId){
  const t = txs.find(x => x.id === txId);
  if(!t) return;
  openModal(`
    <div class="modal-title">ویرایش ردیف ${t.type === 'purchase' ? 'خرید' : 'فروش'} <button class="modal-close" id="modal-close">✕</button></div>
    <div class="hint-box" style="margin-top:0;">این ویرایش فقط همین رکورد گردش حساب را اصلاح می‌کند و روی موجودی فعلی انبار اثر نمی‌گذارد.</div>
    <div class="field" style="margin-top:14px;"><label>کالا/خدمت</label><input type="text" value="${t.itemName}" disabled style="opacity:0.6;"></div>
    <div class="two-col">
      <div class="field"><label>تعداد</label><input type="number" id="etx-qty" class="ltr" min="1" value="${t.qty}"></div>
      <div class="field"><label>قیمت واحد</label><input type="number" id="etx-price" class="ltr" min="0" value="${t.unitPrice}"></div>
    </div>
    <div class="field"><label>تاریخ</label><input type="date" id="etx-date" class="ltr" value="${t.date}"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancel-etx">انصراف</button>
      <button class="btn-primary" id="save-etx">ذخیره تغییرات</button>
    </div>
  `);
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('cancel-etx').onclick = closeModal;
  document.getElementById('save-etx').onclick = async () => {
    const qty = parseInt(document.getElementById('etx-qty').value, 10);
    const unitPrice = parseFloat(document.getElementById('etx-price').value);
    const date = document.getElementById('etx-date').value;
    if(!qty || qty < 1 || isNaN(unitPrice) || unitPrice < 0 || !date){
      showToast('لطفاً مقادیر را به‌درستی وارد کنید');
      return;
    }
    const originalQty = t.qty || 1;
    const costPerUnit = originalQty ? ((t.cost || 0) / originalQty) : 0;
    t.qty = qty;
    t.unitPrice = unitPrice;
    t.date = date;
    t.total = qty * unitPrice;
    if(t.type === 'sale'){
      t.cost = costPerUnit * qty;
      t.profit = t.total - t.cost;
    }
    await saveTx();
    closeModal();
    showToast('تراکنش ویرایش شد');
    renderMain();
  };
}

async function deleteTransaction(txId){
  const t = txs.find(x => x.id === txId);
  if(!t) return;

  // برای خرید/فروش کالا، موجودی انبار را متناسب برمی‌گردانیم تا داده‌ها هم‌خوان بمانند
  if(t.kind !== 'service' && t.itemId){
    const item = items.find(i => i.id === t.itemId);
    if(item){
      if(t.type === 'sale'){
        item.qty += t.qty || 0;
        if(item.qty > 0) item.exitDate = null;
      } else if(t.type === 'purchase'){
        item.qty = Math.max(0, item.qty - (t.qty || 0));
      }
      await saveItems();
    }
  }

  txs = txs.filter(x => x.id !== txId);
  await saveTx();
  renderMain();
  showToast('تراکنش حذف شد');
}

/* ===================== Reports Tab ===================== */
function txInReportRange(t){
  if(reportDateFrom && t.date < reportDateFrom) return false;
  if(reportDateTo && t.date > reportDateTo) return false;
  return true;
}
function expenseInReportRange(e){
  if(reportDateFrom && e.date < reportDateFrom) return false;
  if(reportDateTo && e.date > reportDateTo) return false;
  return true;
}

function aggregate(periodType){
  const map = {};
  txs.filter(txInReportRange).forEach(t => {
    const p = jalaliParts(t.date);
    let key, label;
    if(periodType === 'day'){ key = `${p.y}-${p.m}-${p.d}`; label = jalaliDisplay(t.date); }
    else if(periodType === 'month'){ key = `${p.y}-${p.m}`; label = jalaliMonthLabel(t.date); }
    else { key = `${p.y}`; label = toFaDigits(p.y); }

    if(!map[key]) map[key] = { key, label, salesCount:0, salesRevenue:0, cost:0, profit:0, purchaseQty:0, purchaseCost:0, expenseTotal:0 };
    if(t.type === 'sale'){
      map[key].salesCount += t.qty;
      map[key].salesRevenue += t.total;
      map[key].cost += t.cost;
      map[key].profit += t.profit;
    } else {
      map[key].purchaseQty += t.qty;
      map[key].purchaseCost += t.total;
    }
  });
  expenses.filter(expenseInReportRange).forEach(e => {
    const p = jalaliParts(e.date);
    let key, label;
    if(periodType === 'day'){ key = `${p.y}-${p.m}-${p.d}`; label = jalaliDisplay(e.date); }
    else if(periodType === 'month'){ key = `${p.y}-${p.m}`; label = jalaliMonthLabel(e.date); }
    else { key = `${p.y}`; label = toFaDigits(p.y); }

    if(!map[key]) map[key] = { key, label, salesCount:0, salesRevenue:0, cost:0, profit:0, purchaseQty:0, purchaseCost:0, expenseTotal:0 };
    map[key].expenseTotal += e.amount;
  });
  return Object.values(map).sort((a,b) => b.key.localeCompare(a.key));
}

function aggregateSalesByName(kind, categoryFilter){
  const map = {};
  txs.filter(txInReportRange).forEach(t => {
    if(t.type !== 'sale' || t.kind !== kind) return;
    if(categoryFilter && (t.category || 'other') !== categoryFilter) return;
    const key = t.itemName;
    if(!map[key]) map[key] = { name: key, qty: 0, cost: 0, revenue: 0, profit: 0 };
    map[key].qty += t.qty || 0;
    map[key].cost += t.cost || 0;
    map[key].revenue += t.total || 0;
    map[key].profit += t.profit || 0;
  });
  return Object.values(map).sort((a,b) => b.profit - a.profit);
}

      <div class="stat-card"><div class="stat-label">سود ناخالص فروش</div><div class="stat-value ${totalSalesProfit>=0?'green':'red'}">${toman(totalSalesProfit)}</div></div>

function renderCostProfitBreakdown(kind, title, nameHeader, categoryFilter){
  const data = aggregateSalesByName(kind, categoryFilter);
  const totalCost = data.reduce((s,r) => s + r.cost, 0);
  const totalRevenue = data.reduce((s,r) => s + r.revenue, 0);
  const totalProfit = data.reduce((s,r) => s + r.profit, 0);

  const rows = data.map(r => `
    <tr>
      <td>${r.name}</td>
      <td>${numFa(r.qty)}</td>
      <td>${toman(r.cost)}</td>
      <td>${toman(r.revenue)}</td>
      <td class="${r.profit>=0?'stat-value green':'stat-value red'}" style="font-weight:700;">${toman(r.profit)}</td>
    </tr>
  `).join('');

  return `
    <div class="section-title" style="margin-top:20px;"><span>${title}</span></div>
    ${data.length === 0 ? `
      <div class="empty-state"><div class="big">📄</div><p>هنوز فروشی از این نوع ثبت نشده است.</p></div>
    ` : `
      <div class="table-wrap">
        <table>
          <thead><tr><th>${nameHeader}</th><th>تعداد فروخته‌شده</th><th>جمع هزینه</th><th>جمع فروش</th><th>سود</th></tr></thead>
          <tbody>
            ${rows}
            <tr style="background:var(--panel-2);">
              <td style="font-weight:800;">جمع کل</td>
              <td>—</td>
              <td style="font-weight:800;">${toman(totalCost)}</td>
              <td style="font-weight:800;">${toman(totalRevenue)}</td>
              <td class="${totalProfit>=0?'stat-value green':'stat-value red'}" style="font-weight:800;">${toman(totalProfit)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    `}
  `;
}

function invoiceSerialNumber(invoice){
  const p = jalaliParts(invoice.date);
  return `${p.d}${p.m}${p.y}-${invoice.id.slice(-4)}`;
}

async function deleteInvoice(invoiceId){
  const invoice = invoices.find(i => i.id === invoiceId);
  if(!invoice) return;

  const relatedTxs = txs.filter(t => t.invoiceId === invoiceId);
  relatedTxs.forEach(t => {
    if(t.kind !== 'service' && t.itemId){
      const item = items.find(i => i.id === t.itemId);
      if(item){
        item.qty += t.qty || 0;
        if(item.qty > 0) item.exitDate = null;
      }
    }
  });

  txs = txs.filter(t => t.invoiceId !== invoiceId);
  invoices = invoices.filter(i => i.id !== invoiceId);
  await saveItems(); await saveTx(); await saveInvoices();
  renderMain();
  showToast('فاکتور و تراکنش‌های مرتبط حذف شد');
}

function exportData(){
  const payload = {
    appName: 'سامانه بابک',
    exportVersion: 1,
    exportedAt: todayISO(),
    items, txs, invoices, services, customers, reminders, expenses
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `babak-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('فایل پشتیبان دانلود شد');
}

async function handleImportFile(file){
  if(!file) return;
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(err){
    showToast('فایل انتخاب‌شده یک فایل پشتیبان معتبر نیست');
    return;
  }
  const looksValid = data && (Array.isArray(data.items) || Array.isArray(data.txs) || Array.isArray(data.invoices));
  if(!looksValid){
    showToast('ساختار فایل پشتیبان شناسایی نشد');
    return;
  }
  confirmAction('با بازیابی این فایل، تمام اطلاعات فعلی این دستگاه (کالاها، خدمات، مشتریان، یادآوری‌ها، هزینه‌های جانبی، فاکتورها و گردش حساب) برای همیشه با اطلاعات فایل جایگزین می‌شود. ادامه می‌دهید؟', async () => {
    items = Array.isArray(data.items) ? data.items : [];
    txs = Array.isArray(data.txs) ? data.txs : [];
    invoices = Array.isArray(data.invoices) ? data.invoices : [];
    services = Array.isArray(data.services) ? data.services : [];
    customers = Array.isArray(data.customers) ? data.customers : [];
    reminders = Array.isArray(data.reminders) ? data.reminders : [];
    expenses = Array.isArray(data.expenses) ? data.expenses : [];
    cart = [];
    await saveItems(); await saveTx(); await saveInvoices(); await saveServices(); await saveCustomers(); await saveReminders(); await saveExpenses();
    syncCustomerDisplay();
    renderMain();
    showToast('اطلاعات با موفقیت بازیابی شد');
  });
}

/* ===================== Event delegation ===================== */
function attachHandlers(){
  bindMoneyInputFormatting();

  bindTableSearch('inventory-search', v => { inventorySearchQuery = v; }, renderMain);
  bindTableSearch('services-search', v => { servicesSearchQuery = v; }, renderMain);
  bindTableSearch('customers-search', v => { customersSearchQuery = v; }, renderMain);
  bindTableSearch('expenses-search', v => { expensesSearchQuery = v; }, renderMain);
  bindTableSearch('ledger-search', v => { ledgerSearchQuery = v; }, renderMain);
  bindTableSearch('reminders-search', v => { remindersSearchQuery = v; }, renderMain);

  const posAddBtn = document.getElementById('pos-add-btn');
  if(posAddBtn){
    posAddBtn.onclick = () => {
      const sel = document.getElementById('pos-item-select');
      const qtyInput = document.getElementById('pos-qty');
      const itemId = sel.value;
      const qty = parseInt(qtyInput.value, 10);
      if(!itemId){ showToast('کالایی برای افزودن انتخاب نشده'); return; }
      if(!qty || qty < 1){ showToast('تعداد نامعتبر است'); return; }
      addToCart(itemId, qty);
    };
  }
  const posAddServiceBtn = document.getElementById('pos-add-service-btn');
  if(posAddServiceBtn){
    posAddServiceBtn.onclick = () => {
      const sel = document.getElementById('pos-service-select');
      const qtyInput = document.getElementById('pos-service-qty');
      const serviceId = sel.value;
      const qty = parseInt(qtyInput.value, 10);
      if(!serviceId){ showToast('خدمتی برای افزودن انتخاب نشده'); return; }
      if(!qty || qty < 1){ showToast('تعداد نامعتبر است'); return; }
      addServiceToCart(serviceId, qty);
    };
  }
  const posAddAdhocBtn = document.getElementById('pos-add-adhoc-btn');
  if(posAddAdhocBtn){
    posAddAdhocBtn.onclick = () => {
      const category = document.getElementById('pos-adhoc-category').value;
      const name = document.getElementById('pos-adhoc-name').value.trim();
      const cost = parseMoneyInput('pos-adhoc-cost');
      const salePrice = parseMoneyInput('pos-adhoc-sale');
      const qty = parseInt(document.getElementById('pos-adhoc-qty').value, 10);
      if(!name || isNaN(cost) || cost < 0 || isNaN(salePrice) || salePrice < 0 || !qty || qty < 1){
        showToast('لطفاً همه فیلدها را به‌درستی پر کنید');
        return;
      }
      addAdHocServiceToCart(category, name, cost, salePrice, qty);
    };
  }
  document.querySelectorAll('[data-action="cart-inc"]').forEach(b => b.onclick = () => changeCartQty(b.dataset.id, b.dataset.kind, 1));
  document.querySelectorAll('[data-action="cart-dec"]').forEach(b => b.onclick = () => changeCartQty(b.dataset.id, b.dataset.kind, -1));
  document.querySelectorAll('[data-action="cart-remove"]').forEach(b => b.onclick = () => removeCartLine(b.dataset.id, b.dataset.kind));
  const posClearBtn = document.getElementById('pos-clear-btn');
  if(posClearBtn){
    posClearBtn.onclick = () => {
      if(cart.length === 0) return;
      confirmAction('سبد خرید فعلی پاک شود؟', () => { cart = []; syncCustomerDisplay(); renderMain(); });
    };
  }
  const posCheckoutBtn = document.getElementById('pos-checkout-btn');
  if(posCheckoutBtn) posCheckoutBtn.onclick = finalizeSale;

  const posCustomerNameInput = document.getElementById('pos-customer-name');
  const posCustomerPhoneInput = document.getElementById('pos-customer-phone');
  if(posCustomerNameInput && posCustomerPhoneInput){
    posCustomerNameInput.addEventListener('change', () => {
      if(posCustomerPhoneInput.value.trim()) return;
      const match = customers.find(c => c.name === posCustomerNameInput.value.trim());
      if(match && match.phone) posCustomerPhoneInput.value = match.phone;
    });
  }

  document.querySelectorAll('[data-action="sell"]').forEach(b => b.onclick = () => openSellModal(b.dataset.id));
  document.querySelectorAll('[data-action="edit-item"]').forEach(b => b.onclick = () => openEditItemModal(b.dataset.id));
  document.querySelectorAll('[data-action="delete-item"]').forEach(b => {
    b.onclick = () => {
      confirmAction('آیا از حذف این کالا از لیست انبار مطمئن هستید؟ تراکنش‌های قبلی آن در گردش حساب باقی می‌مانند.', async () => {
        items = items.filter(i => i.id !== b.dataset.id);
        await saveItems();
        renderMain();
        showToast('کالا حذف شد');
      });

  });

  document.querySelectorAll('[data-action="edit-service"]').forEach(b => b.onclick = () => openEditServiceModal(b.dataset.id));
  document.querySelectorAll('[data-action="delete-service"]').forEach(b => {
    b.onclick = () => {
      confirmAction('این خدمت از لیست خدمات حذف شود؟', async () => {
        services = services.filter(s => s.id !== b.dataset.id);

      confirmAction('این هزینه حذف شود؟', async () => {
        expenses = expenses.filter(e => e.id !== b.dataset.id);
        await saveExpenses();
        renderMain();
        showToast('هزینه حذف شد');
      });
    };

  document.querySelectorAll('[data-action="complete-reminder"]').forEach(b => b.onclick = () => completeReminder(b.dataset.id));
  document.querySelectorAll('[data-action="ics-reminder"]').forEach(b => b.onclick = () => downloadReminderICS(b.dataset.id));
  document.querySelectorAll('[data-action="edit-reminder"]').forEach(b => {
    if(!b.closest('#modal-card')) b.onclick = () => openEditReminderModal(b.dataset.id);
  });
  document.querySelectorAll('[data-action="delete-reminder"]').forEach(b => {
    if(!b.closest('#modal-card')){
      b.onclick = () => {
        confirmAction('این یادآوری حذف شود؟', async () => {
          reminders = reminders.filter(r => r.id !== b.dataset.id);
          await saveReminders();
          renderMain();
          showToast('یادآوری حذف شد');
        });
      };
    }
  });

  const toggleSoldout = document.getElementById('toggle-soldout');
  if(toggleSoldout) toggleSoldout.onchange = () => { showSoldOut = toggleSoldout.checked; renderMain(); };

  document.querySelectorAll('[data-action="edit-tx"]').forEach(b => {
    b.onclick = () => requestEditPin(() => openEditTransactionModal(b.dataset.id));
  });

  document.querySelectorAll('[data-action="delete-tx"]').forEach(b => {
    b.onclick = () => requestEditPin(() => {
      confirmAction('این تراکنش برای همیشه حذف شود؟ در صورت مربوط بودن به کالا، موجودی انبار متناسب اصلاح می‌شود.', () => deleteTransaction(b.dataset.id));
    });
  });

  document.querySelectorAll('[data-action="download-invoice-excel"]').forEach(b => {
    b.onclick = () => downloadInvoiceExcel(b.dataset.id);
  });

  document.querySelectorAll('[data-action="delete-invoice"]').forEach(b => {
    if(!b.closest('#modal-card')){
      b.onclick = () => requestEditPin(() => {
        confirmAction('این فاکتور و تراکنش‌های مربوط به آن برای همیشه حذف شوند؟ موجودی انبار کالاهای آن به‌طور خودکار اصلاح می‌شود.', () => deleteInvoice(b.dataset.id));
      });
    }
  });

  document.querySelectorAll('.sub-tab').forEach(el => {
    el.onclick = () => {
      if(el.dataset.period){ reportPeriod = el.dataset.period; renderMain(); }
      else if(el.dataset.crmview){ crmSubView = el.dataset.crmview; renderMain(); }
    };

  const applyRangeBtn = document.getElementById('apply-report-range');
  if(applyRangeBtn){
    applyRangeBtn.onclick = () => {
      const from = document.getElementById('report-date-from').value;
      const to = document.getElementById('report-date-to').value;

      reportDateTo = to || null;

      reportDateTo = null;
      renderMain();

  const saveBizBtn = document.getElementById('save-biz-btn');
  if(saveBizBtn){
    saveBizBtn.onclick = async () => {
      businessInfo = {
        name: document.getElementById('biz-name').value.trim(),
        ownerName: document.getElementById('biz-owner').value.trim(),
        phone: document.getElementById('biz-phone').value.trim(),
        nationalId: document.getElementById('biz-national').value.trim(),
        economicCode: document.getElementById('biz-econ').value.trim(),
        registrationNo: document.getElementById('biz-reg').value.trim(),
        address: document.getElementById('biz-address').value.trim(),
        cardNumber: document.getElementById('biz-card').value.trim(),
        shaba: document.getElementById('biz-shaba').value.trim(),
        deliveryTime: document.getElementById('biz-delivery').value.trim(),
        validityNote: document.getElementById('biz-validity').value.trim()

      showToast('اطلاعات فروشنده ذخیره شد');

  const changePassBtn = document.getElementById('change-pass-btn');
  if(changePassBtn){
    changePassBtn.onclick = async () => {
      const cur = document.getElementById('cur-pass').value;
      const n1 = document.getElementById('new-pass1').value;
      const n2 = document.getElementById('new-pass2b').value;
      const curHash = await sha256Hex(cur);
      if(curHash !== authHash){ showToast('رمز عبور فعلی اشتباه است'); return; }
      if(n1.length < 4){ showToast('رمز جدید باید حداقل ۴ کاراکتر باشد'); return; }
      if(n1 !== n2){ showToast('تکرار رمز جدید مطابقت ندارد'); return; }
      const newHash = await sha256Hex(n1);
      await saveAuth(newHash);
      showToast('رمز عبور با موفقیت تغییر کرد');
      document.getElementById('cur-pass').value = '';
      document.getElementById('new-pass1').value = '';
      document.getElementById('new-pass2b').value = '';
    };

  const changePinBtn = document.getElementById('change-pin-btn');
  if(changePinBtn){
    changePinBtn.onclick = async () => {
      if(editPinHash){
        const curPinEl = document.getElementById('cur-pin');
        const curPin = curPinEl ? curPinEl.value.trim() : '';
        const curHash = await sha256Hex(curPin);
        if(curHash !== editPinHash){ showToast('رمز ۴ رقمی فعلی اشتباه است'); return; }
      }
      const n1 = document.getElementById('new-pin1').value.trim();
      const n2 = document.getElementById('new-pin2').value.trim();
      if(!/^\d{4}$/.test(n1)){ showToast('رمز باید دقیقاً ۴ رقم باشد'); return; }
      if(n1 !== n2){ showToast('تکرار رمز جدید مطابقت ندارد'); return; }
      await saveEditPin(await sha256Hex(n1));
      showToast('رمز ۴ رقمی با موفقیت ذخیره شد');
      renderMain();
    };
  }

  const resetBtn = document.getElementById('reset-data-btn');
  if(resetBtn){
    resetBtn.onclick = () => {
      confirmAction('با تایید این عملیات، تمام کالاها، خدمات، مشتریان، یادآوری‌ها، هزینه‌های جانبی و گردش حساب برای همیشه پاک می‌شوند و قابل بازگشت نیستند.', async () => {
        items = []; txs = []; invoices = []; services = []; customers = []; reminders = []; expenses = []; cart = [];
        await saveItems(); await saveTx(); await saveInvoices(); await saveServices(); await saveCustomers(); await saveReminders(); await saveExpenses();
        syncCustomerDisplay();
        renderMain();
        showToast('تمام اطلاعات پاک شد');
      });
    };
  }

  const chooseFolderSettingsBtn = document.getElementById('choose-backup-folder-settings-btn');
  if(chooseFolderSettingsBtn) chooseFolderSettingsBtn.onclick = chooseBackupFolder;

  const manualBackupBtn = document.getElementById('manual-backup-btn');
  if(manualBackupBtn){
    manualBackupBtn.onclick = async () => {
      exportData();
      if(hasBackupFolderConfigured()) await writeAutoBackup();
    };
  }

  const importBtn = document.getElementById('import-data-btn');
  if(importBtn) importBtn.onclick = triggerImportPicker;

  const importInput = document.getElementById('import-file-input');
  if(importInput){
    importInput.onchange = (e) => {
      const file = e.target.files[0];
      handleImportFile(file);
      e.target.value = '';
    };
  }
}

document.getElementById('fab-add').addEventListener('click', () => {
  if(currentTab === 'inventory') openAddItemModal();
  else if(currentTab === 'services') openAddServiceModal();
  else if(currentTab === 'customers') openAddCustomerModal();
  else if(currentTab === 'expenses') openAddExpenseModal();
});
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'modal-overlay') closeModal();
});
document.getElementById('logout-btn').addEventListener('click', () => {
  confirmAction('برای خروج از حساب کاربری مطمئن هستید؟', () => {
    document.getElementById('app-shell').style.display = 'none';
    document.getElementById('fab-add').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    renderLoginEnter();
  });
});

/* ===================== Boot ===================== */
(async function boot(){
  await loadState();
  if(authHash){ renderLoginEnter(); }
  else{ renderLoginSetup(); }
})();
</script>
</body>
</html>
